[project]
name = "blog-marketpalce"
version = "0.1.0"
description = ""
authors = [
    {name = "etigel"}
]
requires-python = ">=3.14,<4"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "sqlalchemy (>=2.0.54,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "greenlet (>=3.5.6,<4.0.0)",
    "pyjwt (>=2.14.0,<3.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "pydantic[email] (>=2.13.5,<3.0.0)",
    "aio-pika (>=10.0.1,<11.0.0)",
    "minio (>=7.2.20,<8.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "pgvector (>=0.5.0,<0.6.0)",
    "fastembed (>=0.8.0,<0.9.0)",
    "openai (>=3.14.1,<4.0.0)",
    "loguru (>=0.7.3,<0.8.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.7,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "typing-extensions (>=4.16.0,<5.0.0)",
    "bandit (>=1.9.4,<2.0.0)",
    "radon (>=6.0.1,<7.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]
extend-exclude = [".venv", "venv", "build", "dist", "__pycache__", "migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]